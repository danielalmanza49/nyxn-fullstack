# ============================================================
# NYXN E-Commerce API — Configuración Principal
# ============================================================

spring.application.name=nyxn-ecommerce-api
server.port=8080

# ─── Base de Datos PostgreSQL ───
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nyxn_ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Redis Cache ───
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ─── Swagger / OpenAPI ───
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── Actuator (Health para Docker HEALTHCHECK) ───
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ───
logging.level.com.nyxn=INFO
logging.level.org.hibernate.SQL=WARN
